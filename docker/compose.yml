# Full local stack: the app plus a Postgres with pgvector.
#
#   cp .env.example .env     # fill in the three required variables
#   docker compose -f docker/compose.yml up -d --build
#
# Redis is optional and off by default — start it with `--profile redis` to get
# resumable chat streams. See docs/self-hosting.md for everything else.
services:
  app:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NO_HTTPS=1
      # Overrides POSTGRES_URL from .env so the app reaches the container below
      # rather than a database on your host.
      - POSTGRES_URL=postgres://postgres:postgres@postgres:5432/better_chatbot
    env_file:
      - ../.env
    networks:
      - better-chatbot
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    # pgvector is required: document embeddings are stored as vector(1536).
    image: pgvector/pgvector:pg17
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=better_chatbot
    networks:
      - better-chatbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Optional: resumable chat streams and a shared cache across instances.
  #   docker compose -f docker/compose.yml --profile redis up -d
  # Then set REDIS_URL=redis://redis:6379 in .env.
  redis:
    image: redis:7-alpine
    profiles: [redis]
    ports:
      - '6379:6379'
    networks:
      - better-chatbot
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  # Intentionally left unnamed: the volume key is prefixed by the compose
  # project name, so renaming services/networks does not orphan existing local
  # data. Adding an explicit name: here WOULD orphan it.
  postgres_data:
  redis_data:

networks:
  better-chatbot:
    driver: bridge
