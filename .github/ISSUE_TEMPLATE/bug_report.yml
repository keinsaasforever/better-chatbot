name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Questions and "how do I…" are quicker in [Discord](https://discord.gg/9dwdAYKBPp).
        Never paste API keys, passwords or database URLs here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: dropdown
    id: hosting
    attributes:
      label: Where does it run?
      options:
        - Vercel (Deploy button)
        - Docker / Docker Compose
        - Local development
        - Desktop app
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version in package.json, or the commit you deployed.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server logs (Vercel → Logs) or the browser console help most. Remove secrets first.
      render: text
