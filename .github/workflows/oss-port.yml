name: OSS Port

# Community pull requests are merged in better-chatbot. This brings each merged
# change that is not here yet back as a pull request against staging, authored
# by its contributor (scripts/oss-sync/port.ts). Until those are released, the
# OSS Sync refuses to publish, so nothing merged there is ever reverted.
#
# Needs OSS_SYNC_TOKEN with Contents and Pull requests (read and write) on both
# repositories, plus Workflows if a contribution touches .github/workflows.
# Pull requests opened with the default GITHUB_TOKEN would not start CI.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: oss-port
  cancel-in-progress: false

jobs:
  port:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout keinsaas-navigator
        uses: actions/checkout@v4
        with:
          path: keinsaas-navigator
          ref: staging
          fetch-depth: 0
          token: ${{ secrets.OSS_SYNC_TOKEN }}

      - name: Checkout better-chatbot
        uses: actions/checkout@v4
        with:
          repository: keinsaasforever/better-chatbot
          path: better-chatbot
          token: ${{ secrets.OSS_SYNC_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.1
          run_install: false

      - name: Install dependencies
        working-directory: keinsaas-navigator
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure git
        working-directory: keinsaas-navigator
        run: |
          git config user.name "keinsaas sync"
          git config user.email "info@keinsaas.com"

      - name: Port community changes
        id: port
        working-directory: keinsaas-navigator
        run: |
          set +e
          pnpm tsx scripts/oss-sync/port.ts \
            --target ../better-chatbot \
            --base origin/staging > ../port.jsonl
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat ../port.jsonl

      - name: Open pull requests
        working-directory: keinsaas-navigator
        env:
          GH_TOKEN: ${{ secrets.OSS_SYNC_TOKEN }}
        run: |
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            status=$(jq -r .status <<<"$line")
            branch=$(jq -r .branch <<<"$line")
            subject=$(jq -r .subject <<<"$line")
            author=$(jq -r .author <<<"$line")
            pr=$(jq -r '.prNumber // empty' <<<"$line")
            sha=$(jq -r .sha <<<"$line")
            origin="https://github.com/keinsaasforever/better-chatbot/commit/$sha"
            [ -n "$pr" ] && origin="https://github.com/keinsaasforever/better-chatbot/pull/$pr"

            case "$status" in
              ready)
                git push origin "$branch"
                body=$(printf '%s\n\n%s\n\n%s\n%s\n' \
                  "Community contribution by ${author%% <*}, merged in the community edition: $origin" \
                  "Review it like any other PR. Once it is released, the next OSS Sync publishes it back to better-chatbot unchanged." \
                  "Files with no counterpart here, if any, are listed in the commit message." \
                  "The sync stays blocked until this is merged and released.")
                gh pr create --base staging --head "$branch" \
                  --title "$subject" --body "$body"
                ;;
              exists)
                echo "::notice::$branch already open for $origin"
                ;;
              conflict)
                echo "::error::Could not apply $origin automatically; port it by hand into a branch whose commit carries 'Ported-From: keinsaasforever/better-chatbot@$sha'."
                ;;
            esac
          done < ../port.jsonl

      - name: Fail on changes that need a manual port
        if: steps.port.outputs.exit != '0'
        run: exit 1
